name: SSLT10 Full Check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: your-auction-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
      - name: Check Node syntax
        run: |
          node --check src/server.js
          node --check src/routes.js
          node --check src/db.js
          node --check src/liveState.js
          node --check src/hostAuth.js
      - name: Check browser script syntax
        run: |
          node --check public/js/realtime-shim.js
          node --check public/js/security-bridge.js
          node --check public/js/host-console.js
          node --check public/js/host-mobile-fixes.js
      - name: Smoke boot
        env:
          SQLITE_PATH: /tmp/sslt10-test.db
          JWT_SECRET: test-only-secret
          SSLT10_HOST_PASSWORD: test-host-password
        run: |
          node src/server.js > /tmp/sslt10.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4000/health && exit 0; sleep 1; done
          cat /tmp/sslt10.log
          exit 1
