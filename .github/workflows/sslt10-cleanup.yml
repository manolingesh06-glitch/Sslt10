name: SSLT10 Legacy Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip ssl cleanup]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: your-auction-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove legacy hardcoded tournament data
        run: node scripts/clean-legacy-ui.js
      - name: Commit cleanup if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git add public/js/app.js public/index.html
          git commit -m "chore: remove legacy tournament data [skip ssl cleanup]"
          git push
