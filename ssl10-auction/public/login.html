<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSL T10 — Season 1 · Live Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css2/main.css">
</head>
<body>

<main class="login">
  <div class="card login__panel" id="panel">
    <div class="login__eyebrow">SSL T10 · Season 1</div>
    <h1 class="login__title display">Live Auction</h1>
    <div class="login__rule"></div>

    <div class="login__tabs">
      <div class="login__tab is-active" data-role="owner">Team Owner</div>
      <div class="login__tab" data-role="host">Host</div>
    </div>

    <form class="login__form" id="loginForm" autocomplete="off">
      <div class="field" id="teamField">
        <label for="team">Team</label>
        <select id="team" required></select>
      </div>
      <div class="field">
        <label for="password">Passcode</label>
        <input id="password" type="password" placeholder="Enter passcode" required>
      </div>
      <button class="btn btn--primary login__submit" type="submit" id="submitBtn">
        <span id="submitLabel">Enter the auction</span>
      </button>
      <div class="toast toast--error login__error" id="loginError"></div>
    </form>

    <div class="login__footnote" id="footnote">Waiting for the auction to be configured…</div>
    <a href="/setup.html" class="login__setup-link">⚙ Host Setup — configure this auction</a>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/js2/login.js"></script>
</body>
</html>
